; PlatformIO project configuration for the M5Stack LLM smart IR remote (MVP).
;
; The project targets several M5Stack models. Each [env:<name>] selects a board
; and the GPIO numbers of the Grove port used by the M5Stack Unit IR (U002).
;
; Default env is the CoreS3 *without* IR hardware support (the IR unit has not
; arrived yet). Once the Unit IR is connected, build an `-ir` env, e.g.:
;
;   pio run -e m5stack-cores3-ir -t upload
;
; See docs/hardware.md for the Grove pinout.
[platformio]
default_envs = m5stack-cores3

[env]
platform = espressif32
framework = arduino
; Reads the git-ignored root .env and generates include/secrets_generated.h
; (Wi-Fi / API key / relay settings) before compilation.
extra_scripts = pre:extra_script.py
monitor_speed = 115200
upload_speed = 1500000
monitor_filters =
    esp32_exception_decoder
    time
build_flags =
    -DM5IR_VERSION=\"0.1.0\"
    -DM5IR_HOSTNAME=\"m5ir\"
    -DM5IR_HTTP_PORT=80
; M5IR_ENABLE_IR_HW is intentionally left at its default (0) here. The `-ir`
; environments below set it to 1. The IR unit has not arrived yet, so the
; default build uses a stub IR backend that keeps the HTTP/relay plumbing fully
; testable without the physical sensor.
lib_deps =
    m5stack/M5Unified@^0.3.0
    bblanchon/ArduinoJson@^7.4.0
    links2004/WebSockets@^2.7.0
    crankyoldgit/IRremoteESP8266@^2.9.0

; ---------------------------------------------------------------------------
; M5Stack CoreS3 (ESP32-S3) - recommended
; Unit IR on PORT.B (black Grove): Yellow = G9 (IR_TX), White = G8 (IR_RX)
; ---------------------------------------------------------------------------
[env:m5stack-cores3]
board = m5stack-cores3
build_flags =
    ${env.build_flags}
    -DM5IR_IR_TX_PIN=9
    -DM5IR_IR_RX_PIN=8

[env:m5stack-cores3-ir]
extends = env:m5stack-cores3
build_flags =
    ${env:m5stack-cores3.build_flags}
    -DM5IR_ENABLE_IR_HW=1

; ---------------------------------------------------------------------------
; M5Stack Core (Basic / Gray, ESP32-D0WDQ6-V3, 16 MB Flash) - original M5Stack
;
; The classic Core has only the red Grove PORT.A (I2C: G21/G22) on the case, so
; Unit IR cannot be plugged in directly (spec 3.2). Wire it to the M5-Bus pins
; G26 (yellow = IR_TX) and G36 (white = IR_RX), or use a base expansion.
; ---------------------------------------------------------------------------
[env:m5stack-core16m]
board = m5stack-core-esp32-16M
board_build.partitions = default_16MB.csv
build_flags =
    ${env.build_flags}
    -DM5IR_IR_TX_PIN=26
    -DM5IR_IR_RX_PIN=36

[env:m5stack-core16m-ir]
extends = env:m5stack-core16m
build_flags =
    ${env:m5stack-core16m.build_flags}
    -DM5IR_ENABLE_IR_HW=1

; Synthetic IR backend for API lifecycle tests before the Unit IR arrives.
; NOT for production: IR endpoints answer as if a remote had been learned/sent.
[env:m5stack-core16m-test]
extends = env:m5stack-core16m
build_flags =
    ${env:m5stack-core16m.build_flags}
    -DM5IR_FAKE_IR_BACKEND=1

; ---------------------------------------------------------------------------
; M5Stack Core2 (ESP32) - Unit IR on PORT.B (black Grove):
; Yellow = G26 (IR_TX), White = G36 (IR_RX, input only)
; ---------------------------------------------------------------------------
[env:m5stack-core2]
board = m5stack-core2
build_flags =
    ${env.build_flags}
    -DM5IR_IR_TX_PIN=26
    -DM5IR_IR_RX_PIN=36

[env:m5stack-core2-ir]
extends = env:m5stack-core2
build_flags =
    ${env:m5stack-core2.build_flags}
    -DM5IR_ENABLE_IR_HW=1

; ---------------------------------------------------------------------------
; M5StickC Plus2 (ESP32) - Unit IR on the Grove port (PORT.CUSTOM):
; Yellow = G32 (IR_TX), White = G33 (IR_RX)
; Note: the Plus2 also has a built-in IR emitter on G19, which this project
; does not use (Unit IR is the transmitter/receiver specified by the spec).
; ---------------------------------------------------------------------------
[env:m5stack-stickc-plus2]
board = m5stack-stickc-plus2
build_flags =
    ${env.build_flags}
    -DM5IR_IR_TX_PIN=32
    -DM5IR_IR_RX_PIN=33

[env:m5stack-stickc-plus2-ir]
extends = env:m5stack-stickc-plus2
build_flags =
    ${env:m5stack-stickc-plus2.build_flags}
    -DM5IR_ENABLE_IR_HW=1

; ---------------------------------------------------------------------------
; M5Stack AtomS3 (ESP32-S3) - Unit IR on the Grove port (PORT.CUSTOM):
; Yellow = G2 (IR_TX), White = G1 (IR_RX)
; ---------------------------------------------------------------------------
[env:m5stack-atoms3]
board = m5stack-atoms3
build_flags =
    ${env.build_flags}
    -DM5IR_IR_TX_PIN=2
    -DM5IR_IR_RX_PIN=1

[env:m5stack-atoms3-ir]
extends = env:m5stack-atoms3
build_flags =
    ${env:m5stack-atoms3.build_flags}
    -DM5IR_ENABLE_IR_HW=1
